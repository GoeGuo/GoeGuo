
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Learn U.S. States &amp; Capitals - Image Map Version</title>
<style>

    }
    input {
      margin-top: 10px;

      border: 1px solid #555;
      border-radius: 5px;

      color: white;
    }
    img {
      width: 100%;
      max-width: 650px;
      margin: 15px 0;
      border-radius: 8px;
    }
  
button {
  padding: 10px 18px;
  font-size: 16px;
  margin: 5px;
  border-radius: 8px;
  cursor: pointer;
}

button {
  padding: 10px 18px;
  font-size: 16px;
  margin: 5px;
  border-radius: 8px;
  cursor: pointer;
  background-color: #f0f0f0;
  border: 1px solid #ccc;
}
.button-group {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}
</style>
</head>
<body>
<h1>🗺️ Learn U.S. States and Capitals</h1>
<div class="card">
<img alt="U.S. map with capitals" src="us_map_with_capitals.jpeg"/>
<div class="state" id="stateName" onmouseover="speakHover('state')">State: </div>
<input id="stateInput" onfocus="speakHover('state')" oninput="checkAnswer()" placeholder="Type the state name..." type="text"/>
<div class="capital" id="capitalName" onmouseover="speakHover('capital')">Capital: </div>
<input id="capitalInput" onfocus="speakHover('capital')" oninput="checkAnswer()" placeholder="Type the capital name..." type="text"/>




<div class="hint-text" id="hintText">Hint appears here...</div><div class="button-group"><button class="listen" onclick="speakFull()">🔊 Listen All</button><button class="nav" onclick="prevCard()">⬅ Back</button><button class="nav" onclick="nextCard()">Next ➡</button><button class="hint" onclick="toggleHint()">💡 Hint</button></div>
</div>
<script>
const data = [

  {"state": "Maine", "capital": "Augusta", "hint": "Augusta is known for lobsters and forests."},
  {"state": "Maryland", "capital": "Annapolis", "hint": "Annapolis is home to the U.S. Naval Academy."},
  {"state": "Massachusetts", "capital": "Boston", "hint": "Boston played a key role in the American Revolution."},
  {"state": "Michigan", "capital": "Lansing", "hint": "Lansing is near the Great Lakes."},
  {"state": "Minnesota", "capital": "Saint Paul", "hint": "Saint Paul is part of the Twin Cities."},
  {"state": "Mississippi", "capital": "Jackson", "hint": "Jackson has many blues music festivals."},

  {"state": "New Hampshire", "capital": "Concord", "hint": "Concord is one of the oldest U.S. capitals."},
  {"state": "New Jersey", "capital": "Trenton", "hint": "Trenton hosted a key Revolutionary War battle."},

  {"state": "West Virginia", "capital": "Charleston", "hint": "Charleston is in the Appalachian Mountains."},

  {"state": "Wyoming", "capital": "Cheyenne", "hint": "Cheyenne celebrates cowboy culture each July."}
];

let current = 0;

function updateCard() {
  const s = data[current];
  document.getElementById("stateName").textContent = "State: " + s.state;
  document.getElementById("capitalName").textContent = "Capital: " + s.capital;
  document.getElementById("stateInput").value = "";
  document.getElementById("capitalInput").value = "";
  document.getElementById("hintText").style.display = "none";
  document.getElementById("hintText").textContent = s.hint;
}

function speak(text) {
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  speechSynthesis.speak(utterance);
}

function speakFull() {
  const s = data[current];
  speak("The capital of " + s.state + " is " + s.capital);
}

function speakHover(type) {
  const s = data[current];
  if (type === 'state') speak(s.state);
  else if (type === 'capital') speak(s.capital);
}

function nextCard() {
  current = (current + 1) % data.length;
  updateCard();
}

function prevCard() {
  current = (current - 1 + data.length) % data.length;
  updateCard();
}

function toggleHint() {
  const hint = document.getElementById("hintText");
  hint.style.display = hint.style.display === "none" ? "block" : "none";
}

function checkAnswer() {
  const s = data[current];
  const stateInput = document.getElementById("stateInput").value.trim().toLowerCase();
  const capitalInput = document.getElementById("capitalInput").value.trim().toLowerCase();
  if (stateInput === s.state.toLowerCase() && capitalInput === s.capital.toLowerCase()) {
    setTimeout(nextCard, 500);
  }
}

updateCard();


window.onload = function () { updateCard(); };</script>
</body>
</html>
