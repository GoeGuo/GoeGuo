
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Learn U.S. States & Capitals - Image Map Version</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2f;
      color: #ffffff;
      text-align: center;
      padding: 30px;
    }
    .card {
      background: #2b2b3c;
      padding: 25px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      max-width: 700px;
      margin: 20px auto;
    }
    h1 {
      margin-bottom: 30px;
    }
    .state, .capital {
      font-size: 28px;
      margin: 12px 0;
      cursor: pointer;
    }
    .state:hover, .capital:hover {
      text-decoration: underline;
    }
    button {
      margin: 6px;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .listen { background-color: #4CAF50; color: white; }
    .nav { background-color: #2196F3; color: white; }
    .hint { background-color: #f39c12; color: white; }
    .hint-text {
      font-style: italic;
      color: #aaa;
      margin-top: 10px;
      display: none;
    }
    input {
      margin-top: 10px;
      padding: 8px;
      font-size: 16px;
      width: 80%;
      border: 1px solid #555;
      border-radius: 5px;
      background-color: #3a3a50;
      color: white;
    }
    img {
      width: 100%;
      max-width: 650px;
      margin: 15px 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<h1>🗺️ Learn U.S. States and Capitals</h1>
<div class="card">
  <img src="us_map_with_capitals.jpeg" alt="U.S. map with capitals">
  <div class="state" id="stateName" onmouseover="speakHover('state')">State: </div>
  <input type="text" id="stateInput" placeholder="Type the state name..." oninput="checkAnswer()" onfocus="speakHover('state')">
  <div class="capital" id="capitalName" onmouseover="speakHover('capital')">Capital: </div>
  <input type="text" id="capitalInput" placeholder="Type the capital name..." oninput="checkAnswer()" onfocus="speakHover('capital')">

  <button class="listen" onclick="speakFull()">🔊 Listen All</button>
  <button class="nav" onclick="prevCard()">⬅ Back</button>
  <button class="nav" onclick="nextCard()">Next ➡</button>
  <button class="hint" onclick="toggleHint()">💡 Hint</button>

  <div class="hint-text" id="hintText">Hint appears here...</div>
</div>

<script>
  const data = [
    {
      state: "Alabama", capital: "Montgomery",
      hint: "Montgomery was central to the Civil Rights Movement."
    },
    {
      state: "Alaska", capital: "Juneau",
      hint: "Juneau is only reachable by plane or boat."
    },
    {
      state: "Arizona", capital: "Phoenix",
      hint: "Phoenix has extremely hot summers."
    },
    {
      state: "Arkansas", capital: "Little Rock",
      hint: "Little Rock is known for desegregation history."
    },
    {
      state: "California", capital: "Sacramento",
      hint: "Sacramento became capital during the Gold Rush."
    }
  ];

  let current = 0;

  function updateCard() {
    const s = data[current];
    document.getElementById("stateName").textContent = "State: " + s.state;
    document.getElementById("capitalName").textContent = "Capital: " + s.capital;
    document.getElementById("stateInput").value = "";
    document.getElementById("capitalInput").value = "";
    document.getElementById("hintText").style.display = "none";
    document.getElementById("hintText").textContent = s.hint;
  }

  function speak(text) {
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
    speechSynthesis.speak(utterance);
  }

  function speakFull() {
    const s = data[current];
    speak("The capital of " + s.state + " is " + s.capital);
  }

  function speakHover(type) {
    const s = data[current];
    if (type === 'state') speak(s.state);
    else if (type === 'capital') speak(s.capital);
  }

  function nextCard() {
    current = (current + 1) % data.length;
    updateCard();
  }

  function prevCard() {
    current = (current - 1 + data.length) % data.length;
    updateCard();
  }

  function toggleHint() {
    const hint = document.getElementById("hintText");
    hint.style.display = hint.style.display === "none" ? "block" : "none";
  }

  function checkAnswer() {
    const s = data[current];
    const stateInput = document.getElementById("stateInput").value.trim().toLowerCase();
    const capitalInput = document.getElementById("capitalInput").value.trim().toLowerCase();
    if (stateInput === s.state.toLowerCase() && capitalInput === s.capital.toLowerCase()) {
      setTimeout(nextCard, 500);
    }
  }

  updateCard();
</script>

</body>
</html>
