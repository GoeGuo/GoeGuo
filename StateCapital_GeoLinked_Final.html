function speak(text) {
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);

  speechSynthesis.speak(utterance);
}

  const geoOut = document.getElementById("geoOutput");

  if (capital && geo) {
    output.textContent = "Capital: " + capital;
