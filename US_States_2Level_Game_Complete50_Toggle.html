
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>U.S. States &amp; Capitals Learning Game</title>
<style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1e1e2f;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 30px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }
    .tabs button {
      background-color: #444;
      border: none;
      color: white;
      padding: 14px 28px;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
      margin: 5px;
    }
    .tabs button.active {
      background-color: #2196F3;
    }
    .tab-content {
      display: none;
      margin-top: 20px;
    }
    .visible {
      display: block;
    }
    iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 10px #000;
    }
  </style>
</head>
<body>
<h1>🎮 U.S. States &amp; Capitals - Two Level Learning Game</h1>
<div class="tabs">
<button class="active" onclick="switchTab('level1')">Level 1: Match &amp; Learn</button>
<button onclick="switchTab('level1cn')">Level 1 (中文对照)</button>
<button onclick="switchTab('level2')">Level 2: Explore Geography</button>
</div>
<div class="tab-content visible" id="level1">
<iframe src="LearnMode_ImageMap_Complete50.html"></iframe>
</div>
<div class="tab-content" id="level1cn">
<iframe src="LearnMode_ImageMap_Complete50_CN_Full_UPDATED.html"></iframe>
</div>
<div class="tab-content" id="level2">
<iframe src="StateCapital_GeoLinked_Final.html"></iframe>
</div>
<script>
function switchTab(level) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('visible'));
  document.querySelectorAll('.tabs button').forEach(btn => btn.classList.remove('active'));
  document.getElementById(level).classList.add('visible');
  event.target.classList.add('active');
}
</script>
</body>
</html>
