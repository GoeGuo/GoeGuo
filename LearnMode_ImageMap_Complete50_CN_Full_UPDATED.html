<div class="card">

<input id="stateInput" onfocus="speakHover('state')" oninput="checkAnswer()" placeholder="Type the state name..." type="text"/>
<div class="capital" id="capitalName" onmouseover="speakHover('capital')">Capital: </div>
<input id="capitalInput" onfocus="speakHover('capital')" oninput="checkAnswer()" placeholder="Type the capital name..." type="text"/>




<div class="hint-text" id="hintText">Hint appears here...</div><div class="button-group"><button class="listen" onclick="speakFull()">🔊 Listen All</button><button class="nav" onclick="prevCard()">⬅ Back</button><button class="nav" onclick="nextCard()">Next ➡</button><button class="hint" onclick="toggleHint()">💡 Hint</button></div>

  let current = 0;

  function updateCard() {
    const s = data[current];
    document.getElementById("stateName").textContent = "State: " + s.state + " (" + s.state_cn + ")";
    document.getElementById("capitalName").textContent = "Capital: " + s.capital + " (" + s.capital_cn + ")";
    document.getElementById("stateInput").value = "";
    document.getElementById("capitalInput").value = "";
    document.getElementById("hintText").style.display = "none";
    document.getElementById("hintText").textContent = s.hint;
  }

  function speak(text) {
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
    speechSynthesis.speak(utterance);
  }

  function speakFull() {
    const s = data[current];
    speak("The capital of " + s.state + " is " + s.capital);
  }

  function speakHover(type) {
    const s = data[current];
    if (type === 'state') speak(s.state);
    else if (type === 'capital') speak(s.capital);
  }

  function nextCard() {
    current = (current + 1) % data.length;
    updateCard();
  }

  function prevCard() {
    current = (current - 1 + data.length) % data.length;
    updateCard();
  }

  function toggleHint() {
    const hint = document.getElementById("hintText");
    hint.style.display = hint.style.display === "none" ? "block" : "none";
  }

  function checkAnswer() {
    const s = data[current];
    const stateInput = document.getElementById("stateInput").value.trim().toLowerCase();
    const capitalInput = document.getElementById("capitalInput").value.trim().toLowerCase();
    if (stateInput === s.state.toLowerCase() && capitalInput === s.capital.toLowerCase()) {
      setTimeout(nextCard, 500);
    }
  }

  updateCard();
    

window.onload = function () { updateCard(); };</script>
</body>
</html>
